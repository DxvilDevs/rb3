<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RoBlast logo">
  <defs>
    <mask id="logo-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <image href="roblast-favicon.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid meet"/>
    </mask>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.72 0 0 0 0.32  0 0.35 0 0 0.08  0 0 1 0 0.95  0 0 0 .72 0"/>
    </filter>
    <linearGradient id="side" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8b35f5"/>
      <stop offset="0.55" stop-color="#5a1bc2"/>
      <stop offset="1" stop-color="#36127d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f4efff"/>
      <stop offset="1" stop-color="#d9c9ff"/>
    </linearGradient>
  </defs>

  <!-- atmospheric glow -->
  <g mask="url(#logo-mask)" filter="url(#softGlow)" opacity=".9">
    <rect width="512" height="512" fill="#b66cff"/>
  </g>

  <!-- deep extrusion -->
  <g mask="url(#logo-mask)" fill="url(#side)" opacity=".98">
    <rect width="512" height="512" transform="translate(20 30)"/>
    <rect width="512" height="512" transform="translate(18 27)"/>
    <rect width="512" height="512" transform="translate(16 24)"/>
    <rect width="512" height="512" transform="translate(14 21)"/>
    <rect width="512" height="512" transform="translate(12 18)"/>
    <rect width="512" height="512" transform="translate(10 15)"/>
    <rect width="512" height="512" transform="translate(8 12)"/>
    <rect width="512" height="512" transform="translate(6 9)"/>
    <rect width="512" height="512" transform="translate(4 6)"/>
    <rect width="512" height="512" transform="translate(2 3)"/>
  </g>

  <!-- premium white face -->
  <g mask="url(#logo-mask)">
    <rect width="512" height="512" fill="url(#front)"/>
  </g>

  <!-- subtle face highlight -->
  <g mask="url(#logo-mask)" opacity=".55">
    <rect width="512" height="512" fill="url(#front)" transform="translate(-2 -2)"/>
  </g>
</svg>
